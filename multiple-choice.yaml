$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/multiple-choice-question/0.1.0
license: MIT
locale: en-US
id: mcq_bank_account_deposit
title: Semantic HTML Action Button Selection
description: Choose the correct, accessible, and semantic HTML element for triggering bank account deposit actions.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: multiple-choice-question
  difficulty: intermediate
  prereq_topics:
    - html5-basics
    - semantic-html
  topics:
    - html5
    - semantics
    - accessibility
    - dom
    - ui-components
include_choices: 4
question: |
  Given the `BankAccount` card component requirements:
  
  Which of the following represents the correct, accessible, and semantic HTML markup for an interactive element that triggers a deposit of 100 into the bank account?
choices:
  - body: |
      ```html
      <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! The native `<button>` element provides built-in keyboard navigation (Tab/Enter/Space), proper accessibility roles for screen readers, and standard click dispatching.
  - body: |
      ```html
      <div class="btn btn-deposit" id="btn-deposit">Deposit 100</div>
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Generic `<div>` tags are non-semantic and not keyboard-focusable by default, creating severe accessibility barriers for users relying on keyboards or assistive tech.
  - body: |
      ```html
      <a href="#deposit" class="btn btn-deposit" id="btn-deposit">Deposit 100</a>
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Anchor tags (`<a>`) represent navigational links between documents or URI targets, not in-page actions that modify application state.
  - body: |
      ```html
      <input type="text" class="btn btn-deposit" id="btn-deposit" value="Deposit 100">
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. `<input type="text">` renders an editable single-line text input field rather than an interactive action trigger.
