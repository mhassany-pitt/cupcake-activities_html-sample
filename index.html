<style>
  .bank-account {
    max-width: 360px;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .account-owner {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    color: #0f172a;
  }
  .transaction-deposit {
    margin: 0;
    color: #16a34a;
    font-weight: 600;
  }
  .transaction-withdraw {
    margin: 0;
    color: #dc2626;
    font-weight: 600;
  }
  .balance-output {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    color: #0f172a;
  }
  .account-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .btn {
    flex: 1;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s ease;
  }
  .btn-deposit {
    background-color: #2563eb;
    color: #ffffff;
  }
  .btn-deposit:hover {
    background-color: #1d4ed8;
  }
  .btn-withdraw {
    background-color: #f1f5f9;
    color: #334155;
    border-color: #e2e8f0;
  }
  .btn-withdraw:hover {
    background-color: #e2e8f0;
  }
</style>

<div class="bank-account" id="account-card">
  <div class="account-header">
    <h2 class="account-owner">Bob</h2>
  </div>
  <div class="account-transactions">
    <p class="transaction-deposit">Deposited 100</p>
    <p class="transaction-withdraw">Withdrew 50</p>
  </div>
  <div class="account-balance">
    <p class="balance-output">Balance: 250</p>
  </div>
  <div class="account-actions">
    <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
    <button class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</button>
  </div>
</div>
