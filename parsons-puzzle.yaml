---
"$schema": https://learning-contents.org/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: index.html
title: Bank Account HTML Component Structure
description: Rearrange the HTML blocks to build a valid, semantic bank account card
  component with header, transactions, balance, and action buttons.
authors:
- first: Jone
  last: Doe
  email: jone.doe@example.com
  affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
  - html5-basics
  - semantic-html
  topics:
  - html5
  - semantics
  - accessibility
  - dom
  - ui-components
runtime:
  language: html
statement: |
  Rearrange the HTML blocks to correctly construct the `BankAccount` card component.
  Make sure to:
  1. Place the account owner heading in the card header.
  2. Record the chronological transactions (deposit first, then withdrawal).
  3. Display the computed final balance.
  4. Include accessible interactive action buttons.
executions:
- title: Standard Transaction
  stdout: |-
    Bob
    Deposited 100
    Withdrew 50
    Balance: 250
    Deposit 100
    Withdraw 50
  console: |-
    Bob
    Deposited 100
    Withdrew 50
    Balance: 250
    Deposit 100
    Withdraw 50
  status: pass
elements:
- type: fold
  location:
    pattern: "<style>[\\s\\S]*?<\\/style>"
  summary: "\U0001F3A8 CSS Styles (<style>)"
  collapsed: true
- type: block
  group: card-sections
  location:
    snippet: |2-
        <div class="account-header">
          <h2 class="account-owner">Bob</h2>
        </div>
  choices:
  - snippet: |2-
        <div class="account-header">
          <h2 class="account-owner">Bob</h2>
        </div>
    role: solution
    explanations:
    - body: 'Correct! Uses an `<h2>` heading element for the account owner name in
        the card header.

'
  - snippet: |-
      <div class="account-header">
        <span class="account-owner">Bob</span>
      </div>
    role: distractor
    explanations:
    - body: 'Incorrect. Using an inline `<span>` instead of a heading element (`<h2>`)
        degrades document outline semantics and screen reader accessibility.

'
- type: block
  group: card-sections
  location:
    snippet: |2-
        <div class="account-transactions">
          <p class="transaction-deposit">Deposited 100</p>
          <p class="transaction-withdraw">Withdrew 50</p>
        </div>
  choices:
  - snippet: |2-
        <div class="account-transactions">
          <p class="transaction-deposit">Deposited 100</p>
          <p class="transaction-withdraw">Withdrew 50</p>
        </div>
    role: solution
    explanations:
    - body: 'Correct! Lists the chronological events with the deposit of 100 preceding
        the withdrawal of 50.

'
  - snippet: |-
      <div class="account-transactions">
        <p class="transaction-withdraw">Withdrew 50</p>
        <p class="transaction-deposit">Deposited 100</p>
      </div>
    role: distractor
    explanations:
    - body: 'Incorrect. The transaction sequence has been inverted: the deposit occurred
        before the withdrawal.

'
- type: block
  group: card-sections
  location:
    snippet: |2-
        <div class="account-balance">
          <p class="balance-output">Balance: 250</p>
        </div>
  choices:
  - snippet: |2-
        <div class="account-balance">
          <p class="balance-output">Balance: 250</p>
        </div>
    role: solution
    explanations:
    - body: 'Correct! Displays the final calculated balance of 250.

'
  - snippet: |-
      <div class="account-balance">
        <p class="balance-output">Balance: 150</p>
      </div>
    role: distractor
    explanations:
    - body: 'Incorrect. 150 is the wrong balance amount (200 + 100 - 50 = 250).

'
- type: block
  group: card-sections
  location:
    snippet: |2-
        <div class="account-actions">
          <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
          <button class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</button>
        </div>
  choices:
  - snippet: |2-
        <div class="account-actions">
          <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
          <button class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</button>
        </div>
    role: solution
    explanations:
    - body: 'Correct! Provides native interactive `<button>` elements with descriptive
        IDs.

'
  - snippet: |-
      <div class="account-actions">
        <div class="btn btn-deposit" id="btn-deposit">Deposit 100</div>
        <div class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</div>
      </div>
    role: distractor
    explanations:
    - body: 'Incorrect. Using generic `<div>` tags for interactive controls causes
        severe accessibility problems because they lack keyboard focus and button
        semantics.

'
