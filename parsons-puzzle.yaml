$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: pp_bank_account
source: index.html
title: Bank Account HTML Component Structure
description: Rearrange the HTML blocks to build a valid, semantic bank account card component with header, transactions, balance, and action buttons.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - html5-basics
    - semantic-html
  topics:
    - html5
    - semantics
    - accessibility
    - dom
    - ui-components
runtime:
  language: html
  version: 5
statement: |
  Rearrange the HTML blocks to correctly construct the `BankAccount` card component.
  Make sure to:
  1. Place the account owner heading in the card header.
  2. Record the chronological transactions (deposit first, then withdrawal).
  3. Display the computed final balance.
  4. Include accessible interactive action buttons.
hints:
  - "Arrange the code blocks in logical sequential order from initialization to final output."
  - "Ensure correct block indentation where applicable."
testcases:
  - title: Standard Transaction
    visible: true
    stdin: []
    stdout: |-
      Bob
      Deposited 100
      Withdrew 50
      Balance: 250
      Deposit 100
      Withdraw 50
    console: |-
      Bob
      Deposited 100
      Withdrew 50
      Balance: 250
      Deposit 100
      Withdraw 50
    status: pass
    feedback:
      on_pass:
        - "Correct! All blocks are sequenced properly to produce the expected output."
      on_fail:
        - "The block ordering or indentation is incorrect. Re-examine the flow of execution."
elements:
  - type: fold
    location:
      pattern: <style>[\s\S]*?<\/style>
    summary: 🎨 CSS Styles (<style>)
    collapsed: true
  - type: block
    group: card-sections
    location:
      snippet: |2-
          <div class="account-header">
            <h2 class="account-owner">Bob</h2>
          </div>
    choices:
      - snippet: |2-
            <div class="account-header">
              <h2 class="account-owner">Bob</h2>
            </div>
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Uses an `<h2>` heading element for the account owner name in the card header.
      - snippet: |-
          <div class="account-header">
            <span class="account-owner">Bob</span>
          </div>
        role: distractor
        explanations:
          - body: |
              Incorrect. Using an inline `<span>` instead of a heading element (`<h2>`) degrades document outline semantics and screen reader accessibility.
  - type: block
    group: card-sections
    location:
      snippet: |2-
          <div class="account-transactions">
            <p class="transaction-deposit">Deposited 100</p>
            <p class="transaction-withdraw">Withdrew 50</p>
          </div>
    choices:
      - snippet: |2-
            <div class="account-transactions">
              <p class="transaction-deposit">Deposited 100</p>
              <p class="transaction-withdraw">Withdrew 50</p>
            </div>
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Lists the chronological events with the deposit of 100 preceding the withdrawal of 50.
  - type: block
    group: card-sections
    location:
      snippet: |2-
          <div class="account-balance">
            <p class="balance-output">Balance: 250</p>
          </div>
    choices:
      - snippet: |2-
            <div class="account-balance">
              <p class="balance-output">Balance: 250</p>
            </div>
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Displays the final calculated balance of 250.
  - type: block
    group: card-sections
    location:
      snippet: |2-
          <div class="account-actions">
            <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
            <button class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</button>
          </div>
    choices:
      - snippet: |2-
            <div class="account-actions">
              <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
              <button class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</button>
            </div>
        role: solution
        indent: 0
        explanations:
          - body: |
              Correct! Provides native interactive `<button>` elements with descriptive IDs.
