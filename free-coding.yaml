$schema: https://learning-contents.org/schemas/free-coding/0.1.0
source: index.html
license: MIT
locale: en-US
id: free_coding_bank_account
title: Bank Account UI Component in HTML5
description: Write semantic HTML elements to structure the transaction history feed, balance display, and action buttons in a BankAccount card component.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
    - html5-basics
    - semantic-html
  topics:
    - html5
    - semantics
    - accessibility
    - dom
    - ui-components
runtime:
  language: html
statement: |
  Inside the `<div class="bank-account" id="account-card">` component:
  1. Add an `<div class="account-transactions">` section with `<p class="transaction-deposit">Deposited 100</p>` and `<p class="transaction-withdraw">Withdrew 50</p>`.
  2. Add an `<div class="account-balance">` section with `<p class="balance-output">Balance: 250</p>`.
  3. Add an `<div class="account-actions">` section with interactive `<button>` elements for `id="btn-deposit"` ("Deposit 100") and `id="btn-withdraw"` ("Withdraw 50").
executions:
  - title: Standard Transaction Component
    stdin: []
    stdout: |-
      Bob
      Deposited 100
      Withdrew 50
      Balance: 250
      Deposit 100
      Withdraw 50
    console: |-
      Bob
      Deposited 100
      Withdrew 50
      Balance: 250
      Deposit 100
      Withdraw 50
    status: pass
elements:
  - type: fold
    location:
      pattern: "<style>[\\s\\S]*?<\\/style>"
    summary: "🎨 CSS Styles (<style>)"
    collapsed: true
  - type: locked
    location:
      snippet: |-
        <style>
          .bank-account {
            max-width: 360px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
          }
          .account-owner {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
          }
          .transaction-deposit {
            margin: 0;
            color: #16a34a;
            font-weight: 600;
          }
          .transaction-withdraw {
            margin: 0;
            color: #dc2626;
            font-weight: 600;
          }
          .balance-output {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
          }
          .account-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
          }
          .btn {
            flex: 1;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
          }
          .btn-deposit {
            background-color: #2563eb;
            color: #ffffff;
          }
          .btn-deposit:hover {
            background-color: #1d4ed8;
          }
          .btn-withdraw {
            background-color: #f1f5f9;
            color: #334155;
            border-color: #e2e8f0;
          }
          .btn-withdraw:hover {
            background-color: #e2e8f0;
          }
        </style>

        <div class="bank-account" id="account-card">
          <div class="account-header">
            <h2 class="account-owner">Bob</h2>
          </div>
  - type: editable
    location:
      snippet: |-
          <div class="account-transactions">
            <p class="transaction-deposit">Deposited 100</p>
            <p class="transaction-withdraw">Withdrew 50</p>
          </div>
          <div class="account-balance">
            <p class="balance-output">Balance: 250</p>
          </div>
          <div class="account-actions">
            <button class="btn btn-deposit" id="btn-deposit">Deposit 100</button>
            <button class="btn btn-withdraw" id="btn-withdraw">Withdraw 50</button>
          </div>
    placeholder: |-
      <!-- 1. Add account-transactions with deposit and withdrawal paragraphs -->

          <!-- 2. Add account-balance with balance-output paragraph -->

          <!-- 3. Add account-actions with deposit and withdraw buttons -->
  - type: locked
    location:
      snippet: |-
        </div>
testcases:
  - title: Standard Component Workflow
    visible: true
    stdin: []
    stdout: |-
      Bob
      Deposited 100
      Withdrew 50
      Balance: 250
      Deposit 100
      Withdraw 50
    console: |-
      Bob
      Deposited 100
      Withdrew 50
      Balance: 250
      Deposit 100
      Withdraw 50
    status: pass
